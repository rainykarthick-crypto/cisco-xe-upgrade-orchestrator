name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Syntax check
        run: python -m py_compile orchestrator.py

      - name: Static analysis (undefined-name gate)
        # Unused-import notices are tolerated; undefined names are not.
        run: |
          python -m pyflakes orchestrator.py > /tmp/pyflakes.txt 2>&1 || true
          cat /tmp/pyflakes.txt
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "::error::undefined names in orchestrator.py"
            exit 1
          fi
          echo "no undefined names"

      - name: CLI surface
        env:
          CISCO_UPGRADE_BASE: ${{ github.workspace }}
        run: |
          python orchestrator.py --version
          python orchestrator.py --help

      - name: Built-in self-test
        env:
          CISCO_UPGRADE_BASE: ${{ github.workspace }}
        run: python orchestrator.py --validate

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          for f in README.md LICENSE requirements.txt CONTRIBUTING.md SECURITY.md \
                   CHANGELOG.md docs/architecture_workflow.md docs/PROJECT_STATUS.md \
                   config.example.json examples/Location_HQ.txt examples/Location_Wada.txt; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "all required files present"

      - name: No real inventory or secrets committed
        run: |
          if git ls-files | grep -E '^(locations/|firmware/|logs/|reports/|state/|backups/)'; then
            echo "runtime/inventory paths must never be committed"; exit 1
          fi
          if git ls-files | grep -Ei '\.(bin|pkg|exe)$'; then
            echo "binary artefacts must not be committed"; exit 1
          fi
          echo "repository is clean of runtime artefacts"

      - name: Markdown fences are balanced
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for path in pathlib.Path('.').rglob('*.md'):
              fences = sum(1 for line in path.read_text(encoding='utf-8').splitlines()
                           if line.startswith('```'))
              if fences % 2:
                  bad.append(f"{path}: {fences} fences")
          print("\n".join(bad) or "all markdown fences balanced")
          sys.exit(1 if bad else 0)
          PY
